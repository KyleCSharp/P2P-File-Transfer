services:
  p2p-file-transfer:
    build: .
    container_name: p2p-file-transfer
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded files
      - ./uploads:/app/uploads
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    network_mode: host  # Use host network to access Tailscale
